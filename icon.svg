    <line x1="17" y1="42" x2="47" y2="42" />
  </g>
  <g fill="#ffffff">
    <circle cx="39" cy="22" r="5" />
    <circle cx="25" cy="32" r="5" />
    <circle cx="33" cy="42" r="5" />
  </g>
</svg>
