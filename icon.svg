<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ACP config">
  <defs>
    <linearGradient id="dac-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6ef3" />
      <stop offset="1" stop-color="#0f3d91" />
